
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --p-white: #ffffff;
    --p-blue1: #1d5ca2;
    --p-blue2: #2b5c8f;
    --p-blue3: #2a2656;
    --p-font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    --p-font-brand: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  }

  .stats-wrap {
    font-family: var(--p-font-primary);
    border: 1.5px solid #b8cce8;
    border-radius: 14px;
    background: var(--p-white);
    padding: 28px 24px 22px;
    overflow: hidden;
  }

  .stats-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    align-items: stretch;
    justify-content: stretch;
  }

  .stat-item {
    flex: 1 1 140px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 14px 10px 14px;
    position: relative;
    min-width: 120px;
  }

  .stat-item:not(:last-child)::after {
    content: '';
    position: absolute;
    right: 0;
    top: 20%;
    height: 60%;
    width: 1px;
    background: linear-gradient(to bottom, transparent, #b8cce8 30%, #b8cce8 70%, transparent);
  }

  .stat-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: #e8f0fb;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
  }

  .stat-icon svg {
    width: 18px;
    height: 18px;
  }

  .stat-number {
    font-family: var(--p-font-brand);
    font-size: 26px;
    font-weight: 800;
    color: var(--p-blue3);
    line-height: 1.1;
    margin-bottom: 4px;
    letter-spacing: -0.5px;
  }

  .stat-number .suffix {
    font-size: 18px;
    font-weight: 700;
    color: var(--p-blue1);
  }

  .stat-sub {
    font-family: var(--p-font-primary);
    font-size: 11px;
    font-weight: 500;
    color: var(--p-blue2);
    opacity: 0.75;
    margin-top: 0;
    margin-bottom: 2px;
    letter-spacing: 0.2px;
  }

  .stat-label {
    font-family: var(--p-font-primary);
    font-size: 12px;
    font-weight: 500;
    color: #4a5568;
    line-height: 1.35;
    max-width: 130px;
  }

  .stat-label .highlight {
    color: var(--p-blue1);
    font-weight: 600;
  }

  @media (max-width: 640px) {
    .stat-item {
      flex: 1 1 44%;
    }
    .stat-item:not(:last-child)::after {
      display: none;
    }
    .stat-item {
      border-bottom: 1px solid #e2eaf5;
    }
    .stat-item:nth-last-child(-n+2) {
      border-bottom: none;
    }
    .stat-number { font-size: 22px; }
  }

  @media (max-width: 400px) {
    .stat-item { flex: 1 1 100%; }
    .stat-item:last-child { border-bottom: none; }
    .stat-item:nth-last-child(-n+2) { border-bottom: 1px solid #e2eaf5; }
  }
</style>

<div class="stats-wrap">
  <div class="stats-grid" id="statsGrid">

    <div class="stat-item">
      <div class="stat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1d5ca2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
          <path d="M9 21V12h6v9"/>
        </svg>
      </div>
      <div class="stat-number"><span class="count" data-target="64">0</span><span class="suffix">+</span></div>
      <div class="stat-label">Active Project Listings</div>
    </div>

    <div class="stat-item">
      <div class="stat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1d5ca2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
      </div>
      <div class="stat-number"><span class="count" data-target="25">0</span><span class="suffix">+</span></div>
      <div class="stat-label">Builders &amp; Developers</div>
    </div>

    <div class="stat-item">
      <div class="stat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1d5ca2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
      </div>
      <div class="stat-number"><span class="count-dec" data-target="4.9">0.0</span><span class="suffix">/5</span></div>
      <div class="stat-label">Customer Rating</div>
    </div>

    <div class="stat-item">
      <div class="stat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1d5ca2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 7 10 17 4 11"/>
          <circle cx="12" cy="12" r="10" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="stat-number"><span class="count" data-target="510">0</span><span class="suffix">+</span></div>
      <div class="stat-sub">7,12,000+ sq.ft</div>
      <div class="stat-label">Sales Completed <span class="highlight">(Apts, Villas &amp; Plots)</span></div>
    </div>

    <div class="stat-item">
      <div class="stat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1d5ca2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
          <line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/>
        </svg>
      </div>
      <div class="stat-number"><span class="count" data-target="1500">0</span><span class="suffix">+</span></div>
      <div class="stat-sub">10,50,000+ sq.ft</div>
      <div class="stat-label">Rental Deals Closed <span class="highlight">(Apts, Villas &amp; Commercial)</span></div>
    </div>

    <div class="stat-item">
      <div class="stat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1d5ca2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </div>
      <div class="stat-number"><span class="count" data-target="2000">0</span><span class="suffix">+</span></div>
      <div class="stat-label">Happy Customers</div>
    </div>

    <div class="stat-item">
      <div class="stat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1d5ca2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
      </div>
      <div class="stat-number"><span class="count" data-target="30">0</span><span class="suffix">+</span></div>
      <div class="stat-label">Localities Tracked in <span class="highlight">Bangalore</span></div>
    </div>

  </div>
</div>

<script>
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function animateCount(el, target, duration) {
    const start = performance.now();
    function frame(now) {
      const elapsed = now - start;
      const progress = Math.min(elapsed / duration, 1);
      const eased = easeOutCubic(progress);
      el.textContent = Math.round(eased * target);
      if (progress < 1) requestAnimationFrame(frame);
      else el.textContent = target;
    }
    requestAnimationFrame(frame);
  }

  function animateDecimal(el, target, duration) {
    const start = performance.now();
    function frame(now) {
      const elapsed = now - start;
      const progress = Math.min(elapsed / duration, 1);
      const eased = easeOutCubic(progress);
      el.textContent = (eased * target).toFixed(1);
      if (progress < 1) requestAnimationFrame(frame);
      else el.textContent = target.toFixed(1);
    }
    requestAnimationFrame(frame);
  }

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      document.querySelectorAll('.count').forEach(el => {
        animateCount(el, parseInt(el.dataset.target), 1600);
      });
      document.querySelectorAll('.count-dec').forEach(el => {
        animateDecimal(el, parseFloat(el.dataset.target), 1600);
      });
      observer.disconnect();
    });
  }, { threshold: 0.2 });

  observer.observe(document.getElementById('statsGrid'));
</script>
